services:
  postgres:
    image: postgres:16-alpine
    container_name: earlyshield_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: earlyshield
      POSTGRES_PASSWORD: earlyshield
      POSTGRES_DB: earlyshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earlyshield -d earlyshield_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: earlyshield_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://earlyshield:earlyshield@postgres:5432/earlyshield_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./watched_folder:/watched

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: earlyshield_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
